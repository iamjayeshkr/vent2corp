<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>vent2corp</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body {
        background-color: #09090b;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .logo-box {
        width: 64px;
        height: 64px;
        background-color: #facc15;
        color: #09090b;
        border-radius: 20px;
        border: 3px solid #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 24px;
        margin-bottom: 16px;
        box-shadow: 4px 4px 0px #ffffff;
      }
      h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
      }
      p {
        font-size: 14px;
        color: #a1a1aa;
        margin-bottom: 24px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .status {
        font-size: 12px;
        font-family: monospace;
        color: #facc15;
      }
      .retry-btn {
        margin-top: 20px;
        padding: 12px 24px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="logo-box">v2c</div>
    <h1>vent2corp</h1>
    <p>say it raw, send it right.</p>

    <div className="spinner" id="spinner"></div>
    <div className="status" id="status">Connecting to vent2corp engine...</div>

    <button class="retry-btn" id="retryBtn" onclick="location.reload()">Retry Connection</button>

    <script>
      // Target Server URL (Local IP / Production Server)
      const SERVER_URL = "http://192.168.1.190:3000";

      async function checkAndRedirect() {
        const statusEl = document.getElementById("status");
        const spinnerEl = document.getElementById("spinner");
        const retryBtn = document.getElementById("retryBtn");

        try {
          // Check if server is reachable
          const res = await fetch(SERVER_URL + "/api/auth/me", { method: "GET" }).catch(() => null);
          window.location.href = SERVER_URL;
        } catch (e) {
          statusEl.innerText = "Connecting to vent2corp server...";
          window.location.href = SERVER_URL;
        }
      }

      setTimeout(checkAndRedirect, 800);
    </script>
  </body>
</html>
